Enter<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>إنشاء حساب | يلا ننهض</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/auth.css">


</head>


<body>


<section class="auth-page">


<div class="auth-box">



<div class="auth-logo">


<img src="assets/logo.png">


<h2>
يلا ننهض
</h2>


<p>
انضم إلى مجتمع المعرفة والتعلم
</p>


</div>





<h3>
إنشاء حساب جديد
</h3>




<form id="registerForm">





<div class="input-group">


<i class="bi bi-person"></i>


<input type="text"

id="name"

placeholder="الاسم الكامل"

required>


</div>





<div class="input-group">


<i class="bi bi-envelope"></i>


<input type="email"

id="registerEmail"

placeholder="البريد الإلكتروني"

required>


</div>





<div class="input-group">


<i class="bi bi-lock"></i>


<input type="password"

id="registerPassword"

placeholder="كلمة المرور"

required>


</div>





<div class="input-group">


<i class="bi bi-lock-fill"></i>


<input type="password"

id="confirmPassword"

placeholder="تأكيد كلمة المرور"

required>


</div>






<label class="terms">


<input type="checkbox" required>


أوافق على شروط الاستخدام


</label>






<button type="submit">

إنشاء الحساب

</button>



</form>





<div class="auth-footer">


لديك حساب بالفعل؟

<a href="login.html">

تسجيل الدخول

</a>


</div>



</div>


</section>






<script src="js/auth.js"></script>


</body>

</html>
