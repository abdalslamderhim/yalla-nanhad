<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي | يلا ننهض</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/profile.css">

</head>

<body>

<header class="main-header">

<div class="container">

<nav class="navbar navbar-expand-lg">

<a class="navbar-brand logo" href="index.html">

<img src="assets/logo.png" alt="Logo">

<span>يلا ننهض</span>

</a>

</nav>

</div>

</header>

<section class="profile-page">

<div class="container">

<div class="row">

<!-- Sidebar -->

<div class="col-lg-4">

<div class="profile-card">

<img src="assets/images/avatar.png"
id="profileAvatar"
class="profile-avatar"
alt="Avatar">

<h3 id="userName">المستخدم</h3>

<p id="userEmail">example@email.com</p>

<button id="logoutBtn" class="btn btn-danger w-100">

<i class="bi bi-box-arrow-right"></i>

تسجيل الخروج

</button>

</div>

</div>

<!-- Content -->

<div class="col-lg-8">

<div class="stats-grid">

<div class="stat-card">

<h4 id="booksCount">0</h4>

<span>الكتب المحفوظة</span>

</div>

<div class="stat-card">

<h4 id="articlesCount">0</h4>

<span>المقالات</span>

</div>

<div class="stat-card">

<h4 id="podcastsCount">0</h4>

<span>البودكاست</span>

</div>

<div class="stat-card">

<h4 id="favoritesCount">0</h4>

<span>المفضلة</span>

</div>

</div>

<div class="profile-section">

<h3>

<i class="bi bi-book"></i>

آخر الكتب

</h3>

<ul id="booksList" class="list-group">

<li class="list-group-item">

لا توجد كتب محفوظة

</li>

</ul>

</div>

<div class="profile-section">

<h3>

<i class="bi bi-file-earmark-text"></i>

آخر المقالات

</h3>

<ul id="articlesList" class="list-group">

<li class="list-group-item">

لا توجد مقالات

</li>

</ul>

</div>

<div class="profile-section">

<h3>

<i class="bi bi-mic"></i>

البودكاست

</h3>

<ul id="podcastsList" class="list-group">

<li class="list-group-item">

لا توجد حلقات

</li>

</ul>

</div>

</div>

</div>

</div>

</section>

<script src="js/profile.js"></script>

</body>

  </html>
